      <h2>Senior-Level Motion Design &amp; Creative Direction for Ambitious Brands</h2>

      <h3>About HRWL &amp; Djamel Haroual</h3>
      <p>
        HRWL is a freelance motion design and creative direction studio founded by Djamel Haroual, based in London,
        United Kingdom. The studio specialises in cinematic brand films, strategic commercials, and motion design for
        ambitious brands, startups, and scale-ups across the globe. Every project at HRWL begins not with animation
        software, but with the client's business problem — narrative arc, color psychology, original sound design, and
        strategic pacing all come before a single keyframe is touched.
      </p>
      <p>
        Djamel Haroual is a senior motion designer and creative director with a comprehensive command of 2D and 3D
        animation, visual identity systems, storyboarding, and cinematic colour grading. HRWL has delivered work for
        clients including Noxisros, produced Google-referenced case studies, and created original character animation
        and brand films that have reached millions of viewers. The studio operates at the intersection of narrative
        storytelling, visual design, and brand strategy — a combination rarely found in freelance motion design. HRWL
        is available for remote engagements worldwide and in-person collaborations in the UK.
      </p>

      <h3>Services &amp; Specialisations</h3>
      <p>
        HRWL offers cinematic brand films — narrative-driven films that fundamentally reframe how audiences perceive a
        brand. The studio also produces strategic commercials, motion design (product demos, explainers, UI animations,
        kinetic typography), visual identity in motion (logo animation and brand motion systems), and full creative
        direction from concept to delivery. Djamel has extensive experience with After Effects, Cinema 4D, DaVinci
        Resolve, Figma, and the full Adobe Creative Suite. View the full portfolio on the
        <a href="/work">Work page</a> or read case studies on how brand films are made and positioned.
      </p>
      <p>
        Past work includes brand films and visual identity systems for
        <a href="/work/noxisros">Noxisros</a>,
        self-brand films for <a href="/work/hrwl-brand-film">HRWL</a>,
        a <a href="/work/theoneyoukeep">short narrative film "The One You Keep"</a>,
        and a <a href="/work/google">Google-inspired short film case study</a>.
        HRWL also produces demo reels and launch campaign motion packages.
        See the full <a href="/work">case study archive</a> or
        learn more on the <a href="/about">About page</a>.
      </p>

      <h3>Why Brand Films Drive Business Results</h3>
      <p>
        A well-crafted brand film communicates a company's who, why, and how in under 60 seconds — faster and more
        memorably than any landing page. Companies using strategic video see up to 80% higher conversion rates on key
        pages. Unlike stock footage or templated ads, a custom brand film positions a business as the premium choice
        and creates lasting brand perception. HRWL's approach — starting with strategy, not timelines — produces films
        that work as hard as a sales team.
        <a href="https://www.instagram.com/hrwl.studio/" rel="noopener noreferrer">Follow HRWL on Instagram</a> to
        see recent work, and connect via
        <a href="https://www.linkedin.com/in/djamel-haroual-9028b3241/" rel="noopener noreferrer">LinkedIn</a>
        for professional enquiries.
      </p>

      <h3>Work With HRWL — Available for Remote &amp; UK Projects</h3>
      <p>
        HRWL is available for global remote contracts and London-area in-person projects. Whether you need a brand film
        for a product launch, a motion design system for a visual identity rollout, or a strategic commercial that
        converts — start the conversation on the
        <a href="/inquiry">Inquiry page</a>.
        Browse the full portfolio at <a href="/work">hrwl.studio/work</a>
        or read about the studio's approach on the <a href="/about">About page</a>.
      </p>
