# netlify.toml — Netlify deployment configuration for HRWL (hrwl.studio)

[build]
  command = "npm run build"
  publish = "dist"

# SPA catch-all redirect — MUST come after static file matches
# Netlify serves static files first, then falls through to this rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security & Performance headers — applied to all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-XSS-Protection = "1; mode=block"

# Long-cache for immutable hashed assets (Vite output)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Shorter cache for root HTML (so updates propagate quickly)
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# No-cache for SEO/AEO files so updates are picked up fast by crawlers
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=UTF-8"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "text/plain; charset=UTF-8"
